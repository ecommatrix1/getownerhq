<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ECEBFA;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- Decorative elements -->
  <circle cx="900" cy="150" r="200" fill="url(#brandGradient)" opacity="0.1" />
  <circle cx="300" cy="480" r="150" fill="#06B6D4" opacity="0.08" />
  <circle cx="1050" cy="550" r="100" fill="#10B981" opacity="0.08" />

  <!-- Main content -->
  <g transform="translate(600, 315)">
    <!-- Logo/Icon -->
    <g transform="translate(-60, -90)">
      <rect x="0" y="0" width="120" height="120" rx="30" fill="url(#brandGradient)" />
      <path d="M35 45 L55 65 L85 35" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Title -->
    <text x="80" y="-10" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#0F172A" text-anchor="middle">
      getOwnerHQ
    </text>

    <!-- Subtitle -->
    <text x="80" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#475569" text-anchor="middle">
      Easiest Management for Gyms & Studios
    </text>

    <!-- Tagline -->
    <text x="80" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="middle">
      QR Check-in • WhatsApp Reminders • Mobile-First
    </text>
  </g>

  <!-- Bottom brand -->
  <text x="1180" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8" text-anchor="end">
    getownerhq.in
  </text>
</svg>